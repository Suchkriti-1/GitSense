kind = "web"
previewPath = "/"
title = "GitFocus - Smart GitHub Notifications"
version = "1.0.0"
id = "artifacts/gitfocus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23458

[services.development]
run = "pnpm --filter @workspace/gitfocus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gitfocus", "run", "build" ]
publicDir = "artifacts/gitfocus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23458"
BASE_PATH = "/"
